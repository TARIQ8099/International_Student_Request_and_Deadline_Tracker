{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="narrow">
  <a class="back" href="{{ url_for('home') }}">{{ icon('arrow-left') }}<span>Back</span></a>
  <form method="post" class="card">
    <span class="card-icon">{{ icon('key') }}</span>
    <h1>Change password</h1>
    <p class="muted">Choose a new password that only you know.</p>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" minlength="{{ min_password }}"
           maxlength="{{ max_password }}" autocomplete="new-password" aria-describedby="new-help" required>
    <p id="new-help" class="help">At least {{ min_password }} characters.</p>
    <label for="confirm_password">Repeat new password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    <div class="actions">
      <button class="btn" type="submit">{{ icon('key') }}<span>Change password</span></button>
      <a class="btn btn-secondary" href="{{ url_for('home') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
